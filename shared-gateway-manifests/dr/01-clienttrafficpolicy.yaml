apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: trust-all-xff
  namespace: common-gw-dr
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-dr
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - 0.0.0.0/0
        - ::/0
